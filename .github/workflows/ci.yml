# Cloudflare CI: build and tests on every change; on a tag v* the packages go to GitHub Packages.

name: Cloudflare CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.403' # exact: the lock files pin the SDK's implicit framework packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 8 + 10)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore Dependencies
        run: dotnet restore --locked-mode

      - name: 🏗️ Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run Tests
        run: dotnet test --no-build --configuration Release

  publish:
    name: Package to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            ${{ env.DOTNET_VERSION }}

      - name: 🔖 Version From the Tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: 📦 Pack
        run: |
          dotnet restore --locked-mode
          dotnet pack src/InfinitySuite360.Cloudflare.OpenApi --no-restore --configuration Release -p:Version="$VERSION" -o out
          dotnet pack src/InfinitySuite360.Cloudflare --no-restore --configuration Release -p:Version="$VERSION" -o out
          dotnet pack src/InfinitySuite360.Cloudflare.AspNetCore --no-restore --configuration Release -p:Version="$VERSION" -o out

      - name: 🚀 Push
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
